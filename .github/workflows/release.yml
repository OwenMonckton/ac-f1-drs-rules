# Push an annotated tag like v1.2.0 to publish a release. The tag message becomes the release notes,
# and the attached zip can be dragged straight into Content Manager.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Check tag matches manifest version
        run: |
          version=$(grep -oP '^VERSION = \K.*' apps/lua/F1DRSRules/manifest.ini | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest VERSION $version"; exit 1
          fi

      - name: Build Content Manager zip
        run: zip -r -X "F1DRSRules-$GITHUB_REF_NAME.zip" apps/lua/F1DRSRules

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" "F1DRSRules-$GITHUB_REF_NAME.zip" \
            --title "F1 DRS Rules $GITHUB_REF_NAME" --notes-from-tag
