[ABOUT]
NAME = F1 DRS Rules
AUTHOR = Claude (for owen_)
VERSION = 1.0.0
DESCRIPTION = Enforces F1-style DRS rules in offline races: no DRS on lap 1, then DRS only in a zone if within 1.0 s of the car ahead at that zone's detection point. Applies to player and AI cars.

[CORE]
LAZY = NONE  ; load with Assetto Corsa and keep running even when the window is closed, so rules always apply

[WINDOW_...]
ID = main
NAME = F1 DRS Rules
FUNCTION_MAIN = windowMain
SIZE = 340, 300
PADDING = 8
